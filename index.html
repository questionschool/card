<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질문예술학교 카드</title>
<meta name="theme-color" content="#0c111c">
<meta name="description" content="마음을 여는 카드들. 질문예술학교가 건네는 카드 모음.">
<meta property="og:title" content="질문예술학교 카드">
<meta property="og:description" content="마음을 여는 카드들 — 오늘의 가치카드부터.">
<meta property="og:image" content="https://card.questionschool.net/img/valuecard.png">
<meta property="og:url" content="https://card.questionschool.net/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://card.questionschool.net/img/valuecard.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88' fill='%23d8b15e'>%E2%9C%A6</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d8b15e;--gold-soft:#e7cd93;--cream:#f6efe1;--paper-edge:#e4d6ba;--text-soft:#9aa3bd;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;}
  body{font-family:"Noto Serif KR",serif;
    background:radial-gradient(900px 600px at 80% 110%, rgba(216,177,94,.10), transparent 60%),
      radial-gradient(700px 500px at 12% 90%, rgba(201,139,110,.10), transparent 60%),
      linear-gradient(170deg,#0c111c 0%,#11182a 55%,#0a0e18 100%);
    color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(40px,8vw,80px) 20px 48px;position:relative;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(1.5px 1.5px at 18% 22%, rgba(231,205,147,.5), transparent),
      radial-gradient(1px 1px at 67% 14%, rgba(246,239,225,.4), transparent),
      radial-gradient(1.2px 1.2px at 43% 78%, rgba(231,205,147,.35), transparent),
      radial-gradient(1px 1px at 88% 64%, rgba(246,239,225,.3), transparent),
      radial-gradient(1px 1px at 8% 60%, rgba(231,205,147,.3), transparent),
      radial-gradient(1.3px 1.3px at 78% 88%, rgba(246,239,225,.35), transparent);
    animation:twinkle 9s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.5}to{opacity:.95}}

  header{text-align:center;z-index:2;margin-bottom:clamp(36px,6vh,60px);animation:fadeDown 1.1s cubic-bezier(.2,.7,.2,1) both;}
  .glyph{font-family:"Cormorant Garamond",serif;font-size:56px;line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(216,177,94,.45);animation:floaty 7.5s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(7px)}50%{transform:translateY(-9px)}}
  .kicker{font-family:"Cormorant Garamond",serif;font-style:italic;letter-spacing:.2em;font-size:clamp(13px,1.8vw,16px);color:var(--gold-soft);text-transform:uppercase;opacity:.85;margin-top:18px;}
  h1{font-weight:500;font-size:clamp(30px,5.5vw,46px);letter-spacing:.04em;margin-top:8px;
    background:linear-gradient(180deg,#fff8ec,#dcc89a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{margin-top:12px;font-size:clamp(14px,1.9vw,16px);color:var(--text-soft);font-weight:300;letter-spacing:.02em;}

  .cards{z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;width:min(94vw,720px);
    animation:fadeUp 1.2s .15s cubic-bezier(.2,.7,.2,1) both;}
  .card{display:flex;flex-direction:column;text-decoration:none;border-radius:20px;padding:26px 24px;min-height:170px;
    background:linear-gradient(180deg, rgba(34,48,79,.55), rgba(15,22,38,.55));border:1px solid rgba(216,177,94,.3);
    box-shadow:0 24px 50px -26px rgba(0,0,0,.7);transition:transform .35s cubic-bezier(.16,.84,.34,1),box-shadow .35s,border-color .35s;position:relative;overflow:hidden;}
  .card:hover{transform:translateY(-6px);border-color:rgba(216,177,94,.6);box-shadow:0 32px 60px -24px rgba(216,177,94,.35);}
  .card .c-glyph{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(216,177,94,.4);}
  .card .c-title{font-size:22px;font-weight:600;color:var(--cream);margin-top:14px;letter-spacing:.03em;}
  .card .c-eng{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold-soft);font-size:15px;margin-top:2px;}
  .card .c-desc{font-size:13.5px;color:var(--text-soft);line-height:1.6;margin-top:12px;font-weight:300;}
  .card .c-go{margin-top:auto;padding-top:14px;font-size:13px;color:var(--gold-soft);letter-spacing:.04em;}
  .card .c-go::after{content:" →";}

  .card.soon{border-style:dashed;border-color:rgba(154,163,189,.3);background:rgba(255,255,255,.02);cursor:default;}
  .card.soon:hover{transform:none;border-color:rgba(154,163,189,.3);box-shadow:0 24px 50px -26px rgba(0,0,0,.7);}
  .card.soon .c-glyph,.card.soon .c-title{color:var(--text-soft);text-shadow:none;}
  .card.soon .c-eng,.card.soon .c-go{color:var(--text-soft);opacity:.7;}
  .card.soon .c-go::after{content:"";}

  footer{z-index:2;margin-top:auto;padding-top:48px;font-family:"Cormorant Garamond",serif;font-style:italic;
    color:rgba(154,163,189,.55);font-size:13px;letter-spacing:.06em;text-align:center;}
  footer a{color:rgba(231,205,147,.7);text-decoration:none;}
  footer a:hover{color:var(--gold-soft);}

  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <header>
    <div class="glyph">✦</div>
    <div class="kicker">Question School</div>
    <h1>질문예술학교 카드</h1>
    <p class="sub">마음을 여는 카드들 — 한 장을 골라 펼쳐보세요.</p>
  </header>

  <main class="cards">
    <a class="card" href="value.html">
      <span class="c-glyph">✦</span>
      <span class="c-title">오늘의 가치카드</span>
      <span class="c-eng">52 Positive Values</span>
      <span class="c-desc">52가지 긍정의 가치 가운데 오늘 닿는 하나를 만나고, 요일의 질문과 마주합니다.</span>
      <span class="c-go">카드 열기</span>
    </a>

    <div class="card soon">
      <span class="c-glyph">✶</span>
      <span class="c-title">질문카드</span>
      <span class="c-eng">Coming soon</span>
      <span class="c-desc">곧 찾아옵니다.</span>
      <span class="c-go">준비 중</span>
    </div>

    <div class="card soon">
      <span class="c-glyph">✶</span>
      <span class="c-title">다음 카드</span>
      <span class="c-eng">Coming soon</span>
      <span class="c-desc">새로운 카드가 이 자리에 더해집니다.</span>
      <span class="c-go">준비 중</span>
    </div>
  </main>

  <footer>질문예술학교 · <a href="https://questionschool.net">questionschool.net</a></footer>
</body>
</html>
